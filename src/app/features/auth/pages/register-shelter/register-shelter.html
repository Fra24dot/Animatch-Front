<app-navbar></app-navbar>
<app-paw-background></app-paw-background>

<div class="register-box">
  <h1>Register Shelter</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-slider" 
         [class.step-two]="currentStep() === 2"
         [class.step-three]="currentStep() === 3">
      
      <div class="form-step step-1">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Nom du refuge</label>
            <input formControlName="name" type="text" />
          </div>
          <div class="form-group">
            <label>N° d'entreprise</label>
            <input formControlName="companyNumber" type="text" />
          </div>
          <div class="form-group">
            <label>Année de création</label>
            <input formControlName="creationYear" type="number" />
          </div>
        </div>
        <button type="button" class="btn-next" (click)="nextStep()">Suivant &rarr;</button>
      </div>

      <div class="form-step step-2">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Adresse</label>
            <input formControlName="address" type="text" />
          </div>
          <div class="form-group">
            <label>Ville</label>
            <input formControlName="city" type="text" />
          </div>
          <div class="form-group">
            <label>Code Postal</label>
            <input formControlName="postalCode" type="text" />
          </div>
          <div class="form-group full-width">
            <label>Numéro de téléphone</label>
            <input formControlName="phoneNumber" type="tel" />
          </div>
        </div>
        <div class="step-buttons">
          <button type="button" class="btn-prev" (click)="prevStep()">&larr; Retour</button>
          <button type="button" class="btn-next-step" (click)="nextStep()">Suivant &rarr;</button>
        </div>
      </div>

      <div class="form-step step-3">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Email professionnel</label>
            <input formControlName="email" type="email" />
          </div>
          <div class="form-group full-width">
            <label>Mot de passe</label>
            <input formControlName="password" type="password" />
          </div>
          <div class="form-group full-width">
            <label>Confirmer le mot de passe</label>
            <input formControlName="confirmPassword" type="password" />
          </div>
        </div>
        <div class="step-buttons">
          <button type="button" class="btn-prev" (click)="prevStep()">&larr; Retour</button>
          <button type="submit" class="btn-register" [disabled]="form.invalid || isLoading()">
            Créer le compte
          </button>
        </div>
      </div>

    </div>
  </form>
</div>
